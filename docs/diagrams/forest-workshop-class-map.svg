    <text x="9" y="16" fill="#285645" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="9" font-weight="normal" text-anchor="start">UManagedQteRules</text>
    <text x="9" y="32" fill="#21372F" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="9" font-weight="normal" text-anchor="start">把 QTE 操作转给回合</text>
    <text x="9" y="46" fill="#475A52" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="8.2" font-weight="normal" text-anchor="start">round: QteRound</text>
    <text x="9" y="58" fill="#475A52" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="8.2" font-weight="normal" text-anchor="start">JoinRound()</text>
  </g>
