    <text x="183" y="46" fill="#475A52" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="8.2" font-weight="normal" text-anchor="start">CanStartMachineRound()</text>
    <text x="183" y="58" fill="#475A52" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="8.2" font-weight="normal" text-anchor="start">ReserveCraft()</text>
  </g>
