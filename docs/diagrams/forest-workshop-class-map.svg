<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 507 400" width="507" height="400" role="img">
  <title>工坊核心 Class Map</title>
  <desc>工坊回合与配方、双绳和交付的类关系，以及原关卡关键流程。</desc>
  <rect x="0" y="0" width="507" height="400" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.7" />
  <g id="managed-qte">
